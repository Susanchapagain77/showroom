function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function go(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('crumb').textContent=({dashboard:'Dashboard',stock:'Stock Overview',inventory:'Inventory',sales:'Sales & Orders',installments:'Installments',finance:'Finance',customers:'Customers',reports:'Reports',settings:'Settings'})[p]||p;document.getElementById('sidebar').classList.remove('open');render()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
document.getElementById('mobileMenu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
document.getElementById('notifications').onclick=()=>showToast('You have 2 items that need attention.');
function pageHead(kicker,title,desc,actions=''){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div><div class="head-actions">${actions}</div></div>`}
function btn(label,action,primary=false,icon=''){return `<button class="btn ${primary?'primary':''}" data-action="${action}">${icon?`<span>${icon}</span>`:''}${label}</button>`}
function stat(label,value,icon,klass,foot){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon ${klass}">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></div>`}
function badge(text){let c=({'Paid':'b-green','Ongoing':'b-blue','Overdue':'b-red','In stock':'b-green','Low stock':'b-amber','Out of stock':'b-red','Cash':'b-green','Installment':'b-blue','Completed':'b-green'})[text]||'b-gray';return `<span class="badge ${c}">${text}</span>`}
function productCell(it){return `<div class="product-cell"><div class="product-thumb">${it.icon||'📦'}</div><div><strong>${esc(it.name)}</strong><small>${esc(it.sku)}</small></div></div>`}
function tablePanel(title,sub,heads,rows,extra=''){return `<section class="panel table-panel"><div class="panel-head"><div><h2>${title}</h2><p>${sub}</p></div>${extra}</div><div class="table-wrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${heads.length}"><div class="empty"><div class="empty-icon">⌕</div><strong>No records found</strong>Try changing your search or add a new record.</div></td></tr>`}</tbody></table></div></section>`}
function inventoryRows(list){return list.map(it=>`<tr><td>${productCell(it)}</td><td>${esc(it.category)}</td><td>${money(it.cost)}</td><td>${money(it.price)}</td><td>${it.qty}</td><td>${badge(it.qty===0?'Out of stock':it.qty<=it.min?'Low stock':'In stock')}</td><td><button class="row-action" data-edit-item="${it.id}" title="Edit item">⋯</button></td></tr>`).join('')}
function saleRows(list){return list.map(s=>`<tr><td><strong style="color:#356ae6">${s.id}</strong></td><td>${s.date}</td><td><strong style="color:#2d3a50">${esc(s.customer)}</strong><br><small style="color:#929bad">${esc(s.phone)}</small></td><td>${esc(s.itemName)}</td><td>${badge(s.mode)}</td><td>${money(s.price*s.qty-s.discount)}</td><td>${money(s.paid)}</td><td>${money(outstanding(s))}</td><td>${badge(outstanding(s)===0?'Paid':s.status)}</td><td><button class="row-action" data-sale="${s.id}" title="View sale">⋯</button></td></tr>`).join('')}
function dash(){let t=totals(),recent=[...sales].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4),low=items.filter(i=>i.qty<=i.min);
return pageHead('OVERVIEW','Good morning, Admin 👋','Here’s what’s happening at your showroom today.',btn('Record a sale','new-sale',true,'＋')+btn('Add new item','new-item',false,'＋'))+
`<div class="stats">${stat('Total stock value',money(t.stockCost),'▤','ic-blue','At purchase cost')}${stat('Sales value',money(t.salesValue),'↗','ic-green','Across all recorded sales')}${stat('Payments collected',money(t.collected),'↙','ic-purple','Cash + installment receipts')}${stat('Outstanding balance',money(t.receivable),'◷','ic-orange','<span class="down">${sales.filter(s=>outstanding(s)>0).length} active</span> installment accounts')}</div>
<div class="grid-two"><section class="panel"><div class="panel-head"><div><h2>Sales performance</h2><p>Recorded sales over the last 7 days</p></div><div class="legend"><span>Sales</span><span>Collections</span></div></div><div class="chart-wrap"><svg class="chart" viewBox="0 0 600 190" preserveAspectRatio="none" aria-label="Sample sales performance chart"><defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#356ae6" stop-opacity=".18"/><stop offset="100%" stop-color="#356ae6" stop-opacity="0"/></linearGradient></defs>${[25,65,105,145].map(y=>`<line x1="0" y1="${y}" x2="600" y2="${y}" stroke="#edf1f7" stroke-dasharray="4 5"/>`).join('')}<path d="M0 132 C45 125 52 80 100 94 S170 133 200 87 S270 48 300 73 S370 113 400 59 S470 75 500 43 S560 65 600 22 L600 165 L0 165 Z" fill="url(#area)"/><path d="M0 132 C45 125 52 80 100 94 S170 133 200 87 S270 48 300 73 S370 113 400 59 S470 75 500 43 S560 65 600 22" fill="none" stroke="#356ae6" stroke-width="3" stroke-linecap="round"/><path d="M0 151 C45 140 52 119 100 132 S170 149 200 123 S270 97 300 112 S370 137 400 104 S470 116 500 93 S560 106 600 80" fill="none" stroke="#b9cdfc" stroke-width="2.5" stroke-linecap="round"/></svg><div class="chart-labels"><span>Oct 25</span><span>Oct 26</span><span>Oct 27</span><span>Oct 28</span><span>Oct 29</span><span>Oct 30</span><span>Oct 31</span></div></div></section>
<section class="panel"><div class="panel-head"><div><h2>Recent activity</h2><p>Latest showroom transactions</p></div><button class="link-btn" data-page="sales">View all ↗</button></div><div class="activity">${recent.map((s,i)=>`<div class="activity-row"><div class="activity-icon">${s.mode==='Cash'?'↗':'◷'}</div><div class="activity-text"><strong>${esc(s.customer)} · ${s.mode==='Cash'?'Cash sale':'Installment sale'}</strong><small>${s.id} · ${s.date}</small></div><div class="activity-amount">${money(s.paid)}</div></div>`).join('')}</div></section></div>
<div class="grid-two"><section class="panel"><div class="panel-head"><div><h2>Recent sales</h2><p>Latest orders and payment status</p></div><button class="link-btn" data-page="sales">All sales ↗</button></div><div class="table-wrap"><table><thead><tr><th>Sale</th><th>Customer</th><th>Payment</th><th>Total</th><th>Balance</th><th>Status</th></tr></thead><tbody>${recent.map(s=>`<tr><td><strong style="color:#356ae6">${s.id}</strong><br><small>${s.date}</small></td><td>${esc(s.customer)}</td><td>${badge(s.mode)}</td><td>${money(s.price*s.qty-s.discount)}</td><td>${money(outstanding(s))}</td><td>${badge(outstanding(s)===0?'Paid':'Ongoing')}</td></tr>`).join('')}</tbody></table></div></section>
<section class="panel"><div class="panel-head"><div><h2>Stock attention</h2><p>Items to review or reorder</p></div><button class="link-btn" data-page="stock">Stock view ↗</button></div><div class="activity">${low.slice(0,4).map(i=>`<div class="activity-row"><div class="activity-icon">${i.icon}</div><div class="activity-text"><strong>${esc(i.name)}</strong><small>${i.qty===0?'No units remaining':`Only ${i.qty} unit${i.qty===1?'':'s'} left`}</small></div>${badge(i.qty===0?'Out of stock':'Low stock')}</div>`).join('')||'<div class="empty">All stock levels look good.</div>'}</div></section></div>`}
function inventoryPage(stockOnly=false){let list=stockOnly?items.filter(i=>i.qty<=i.min):items;let t=totals();return pageHead(stockOnly?'STOCK CONTROL':'PRODUCT CATALOG',stockOnly?'Stock overview':'Inventory management',stockOnly?'Monitor availability and identify items that need restocking.':'Manage showroom products, purchase costs, selling prices and quantities.',btn('Add item','new-item',true,'＋'))+`<div class="stats">${stat('Unique products',items.length,'▣','ic-blue','In your catalog')}${stat('Available units',t.stockUnits,'▤','ic-green','Across all products')}${stat('Low stock items',items.filter(i=>i.qty>0&&i.qty<=i.min).length,'⚠','ic-orange','At or below reorder level')}${stat('Out of stock',items.filter(i=>i.qty===0).length,'○','ic-purple','Need restocking')}</div><div class="panel table-panel"><div class="panel-head"><div><h2>${stockOnly?'Items needing attention':'All inventory items'}</h2><p>${list.length} products · Stock valuation ${money(t.stockCost)}</p></div></div><div class="table-toolbar"><div class="search"><input id="itemSearch" placeholder="Search by item, SKU or category…"></div><div class="filters"><select id="itemCategory"><option value="">All categories</option>${[...new Set(items.map(i=>i.category))].map(c=>`<option>${esc(c)}</option>`).join('')}</select><select id="itemStatus"><option value="">All stock statuses</option><option>In stock</option><option>Low stock</option><option>Out of stock</option></select></div></div><div class="table-wrap"><table><thead><tr><th>Product</th><th>Category</th><th>Purchase price</th><th>Selling price</th><th>Qty</th><th>Status</th><th></th></tr></thead><tbody id="itemRows">${inventoryRows(list)}</tbody></table></div><div class="table-foot"><span id="itemCount">Showing ${list.length} products</span><span>Sample inventory data</span></div></div>`}
function salesPage(){return pageHead('TRANSACTIONS','Sales & orders','Record cash purchases or installment sales and track every balance.',btn('New sale','new-sale',true,'＋'))+`<div class="stats">${stat('Total sales',sales.length,'↗','ic-blue','Recorded transactions')}${stat('Sales value',money(totals().salesValue),'◉','ic-green','After discounts')}${stat('Cash sales',money(sales.filter(s=>s.mode==='Cash').reduce((a,s)=>a+s.paid,0)),'▣','ic-purple','Paid in full')}${stat('Installment balance',money(totals().receivable),'◷','ic-orange','Still to collect')}</div><div class="panel table-panel"><div class="panel-head"><div><h2>Sales register</h2><p>All customer transactions</p></div></div><div class="table-toolbar"><div class="search"><input id="salesSearch" placeholder="Search sale ID, customer or item…"></div><div class="filters"><select id="salesMode"><option value="">All payment types</option><option>Cash</option><option>Installment</option></select><select id="salesStatus"><option value="">All statuses</option><option>Paid</option><option>Ongoing</option></select></div></div><div class="table-wrap"><table><thead><tr><th>Sale ID</th><th>Date</th><th>Customer</th><th>Item</th><th>Payment type</th><th>Total</th><th>Paid</th><th>Balance</th><th>Status</th><th></th></tr></thead><tbody id="salesRows">${saleRows(sales)}</tbody></table></div><div class="table-foot"><span id="salesCount">${sales.length} transactions</span><span>Newest first</span></div></div>`}
function installmentsPage(){let active=sales.filter(s=>outstanding(s)>0);return pageHead('PAYMENT TRACKING','Installments','Track down payments, received installments and remaining customer balances.',btn('Receive payment','receive-payment',true,'＋'))+`<div class="stats">${stat('Active accounts',active.length,'◷','ic-blue','Customers with a balance')}${stat('Total receivable',money(totals().receivable),'◉','ic-orange','Expected future collections')}${stat('Collected to date',money(totals().collected),'↙','ic-green','All payments received')}${stat('Payment records',payments.length,'▤','ic-purple','Receipts recorded')}</div><div class="grid-two"><section class="panel table-panel"><div class="panel-head"><div><h2>Active installment accounts</h2><p>Receive payments against an existing sale</p></div></div><div class="table-wrap"><table><thead><tr><th>Sale / customer</th><th>Sale total</th><th>Paid</th><th>Balance</th><th>Progress</th><th></th></tr></thead><tbody>${active.map(s=>`<tr><td><strong>${s.id}</strong><br><small>${esc(s.customer)}</small></td><td>${money(s.price*s.qty-s.discount)}</td><td>${money(s.paid)}</td><td><strong style="color:#a76508">${money(outstanding(s))}</strong></td><td style="min-width:110px"><div>${Math.round(s.paid/(s.price*s.qty-s.discount)*100)}%</div><div class="barline"><span style="width:${s.paid/(s.price*s.qty-s.discount)*100}%"></span></div></td><td><button class="btn soft" data-pay="${s.id}">＋ Receive</button></td></tr>`).join('')||`<tr><td colspan="6"><div class="empty"><strong>No outstanding balances</strong>All accounts are settled.</div></td></tr>`}</tbody></table></div></section><section class="panel"><div class="panel-head"><div><h2>Recent receipts</h2><p>Payment history, newest first</p></div></div><div class="activity">${[...payments].reverse().slice(0,6).map(p=>`<div class="activity-row"><div class="activity-icon">↙</div><div class="activity-text"><strong>${esc(p.customer)}</strong><small>${p.saleId} · ${p.date} · ${esc(p.method)}</small></div><div class="activity-amount">${money(p.amount)}</div></div>`).join('')}</div></section></div>`}
function financePage(){let t=totals(),cogs=sales.reduce((a,s)=>a+s.cost*s.qty,0),gross=t.salesValue-cogs,net=gross-t.expenses;return pageHead('MONEY OVERVIEW','Finance','Understand collections, product costs, expenses and estimated profit.',btn('Add expense','new-expense',false,'＋'))+`<div class="stats">${stat('Sales revenue',money(t.salesValue),'↗','ic-blue','Recorded sales after discounts')}${stat('Cost of goods sold',money(cogs),'▤','ic-orange','Cost of sold products')}${stat('Gross profit',money(gross),'◉','ic-green',`Gross margin ${t.salesValue?Math.round(gross/t.salesValue*100):0}%`)}${stat('Outstanding receivables',money(t.receivable),'◷','ic-purple','Not yet collected')}</div><div class="grid-two"><section class="panel"><div class="panel-head"><div><h2>Financial summary</h2><p>Based on current sample records</p></div></div><div class="split-stat"><span>Sales revenue</span><strong>${money(t.salesValue)}</strong></div><div class="split-stat"><span>Cost of goods sold</span><strong>− ${money(cogs)}</strong></div><div class="split-stat"><span>Gross profit</span><strong style="color:var(--green)">${money(gross)}</strong></div><div class="split-stat"><span>Operating expenses</span><strong>− ${money(t.expenses)}</strong></div><div class="split-stat" style="background:#f7f9ff"><span><b style="color:#24334a">Estimated net profit</b></span><strong style="font-size:16px;color:${net>=0?'var(--green)':'var(--red)'}">${money(net)}</strong></div><div class="split-stat"><span>Cash collected to date</span><strong>${money(t.collected)}</strong></div><div class="split-stat"><span>Still to collect</span><strong style="color:var(--amber)">${money(t.receivable)}</strong></div></section><section class="panel"><div class="panel-head"><div><h2>Expenses</h2><p>Operating costs recorded so far</p></div><button class="link-btn" data-action="new-expense">＋ Add</button></div><div class="activity">${expenses.map(e=>`<div class="activity-row"><div class="activity-icon">↘</div><div class="activity-text"><strong>${esc(e.name)}</strong><small>${e.date} · ${esc(e.category)}</small></div><div class="activity-amount">−${money(e.amount)}</div></div>`).join('')}</div><div class="split-stat"><span>Total expenses</span><strong>${money(t.expenses)}</strong></div></section></div><p class="form-note">Note: This is an operational estimate from demo records, not a formal accounting statement. Profit uses selling price minus purchase cost; installment receipts are not counted as additional sales.</p>`}
function customersPage(){return pageHead('CUSTOMER DIRECTORY','Customers','Customer details and purchase history in one place.',btn('Add customer','new-customer',true,'＋'))+`<div class="stats">${stat('Customers',customers.length,'♙','ic-blue','In your directory')}${stat('Total sales',sales.length,'↗','ic-green','Linked transactions')}${stat('Active installment customers',new Set(sales.filter(s=>outstanding(s)>0).map(s=>s.customer)).size,'◷','ic-orange','With a remaining balance')}${stat('Outstanding balance',money(totals().receivable),'◉','ic-purple','Across all customers')}</div><div class="panel table-panel"><div class="panel-head"><div><h2>Customer directory</h2><p>Contact information and purchase summaries</p></div></div><div class="table-toolbar"><div class="search"><input id="customerSearch" placeholder="Search customer, phone or location…"></div></div><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Phone</th><th>Location</th><th>Purchases</th><th>Outstanding</th><th></th></tr></thead><tbody id="customerRows">${customerRows(customers)}</tbody></table></div></div>`}
function customerRows(list){return list.map(c=>{let cs=sales.filter(s=>s.customer===c.name);return `<tr><td><div class="product-cell"><div class="avatar">${c.name.split(' ').map(x=>x[0]).slice(0,2).join('')}</div><div><strong>${esc(c.name)}</strong><small>Customer ID C-${String(c.id).padStart(3,'0')}</small></div></div></td><td>${esc(c.phone)}</td><td>${esc(c.address)}</td><td>${cs.length}</td><td>${money(cs.reduce((a,s)=>a+outstanding(s),0))}</td><td><button class="row-action" data-customer="${c.id}">⋯</button></td></tr>`}).join('')}
function reportsPage(){let t=totals(),categories=[...new Set(items.map(i=>i.category))];return pageHead('BUSINESS INSIGHTS','Reports','A quick snapshot of showroom performance and inventory health.',btn('Export CSV','export-csv',false,'↓'))+`<div class="stats">${stat('Sales recorded',sales.length,'↗','ic-blue','All sample transactions')}${stat('Estimated gross profit',money(t.profit),'◉','ic-green','Before operating expenses')}${stat('Stock purchase value',money(t.stockCost),'▤','ic-purple','Current inventory')}${stat('Customer balances',money(t.receivable),'◷','ic-orange','Installments to collect')}</div><div class="grid-two"><section class="panel"><div class="panel-head"><div><h2>Inventory by category</h2><p>Current units on hand</p></div></div><div style="padding:4px 22px 18px">${categories.map((c,i)=>{let n=items.filter(x=>x.category===c).reduce((a,x)=>a+x.qty,0),max=Math.max(1,t.stockUnits);return `<div style="padding:10px 0"><div style="display:flex;justify-content:space-between;font-size:11px"><span>${esc(c)}</span><strong>${n} units</strong></div><div class="barline"><span style="width:${n/max*100}%;background:${['#356ae6','#5b88f0','#83a6f7','#9a7be7','#43a984'][i%5]}"></span></div></div>`}).join('')}</div></section><section class="panel"><div class="panel-head"><div><h2>Payment mix</h2><p>Cash compared with installment sales</p></div></div><div class="split-stat"><span>Cash sales</span><strong>${sales.filter(s=>s.mode==='Cash').length}</strong></div><div class="split-stat"><span>Installment sales</span><strong>${sales.filter(s=>s.mode==='Installment').length}</strong></div><div class="split-stat"><span>Cash collected</span><strong>${money(sales.filter(s=>s.mode==='Cash').reduce((a,s)=>a+s.paid,0))}</strong></div><div class="split-stat"><span>Installment receipts</span><strong>${money(sales.filter(s=>s.mode==='Installment').reduce((a,s)=>a+s.paid,0))}</strong></div></section></div><div class="panel section-gap"><div class="panel-head"><div><h2>Sales detail</h2><p>Download or review recorded sales</p></div></div><div class="table-wrap"><table><thead><tr><th>Sale ID</th><th>Date</th><th>Customer</th><th>Product</th><th>Sale total</th><th>Purchase cost</th><th>Gross profit</th></tr></thead><tbody>${sales.map(s=>`<tr><td>${s.id}</td><td>${s.date}</td><td>${esc(s.customer)}</td><td>${esc(s.itemName)}</td><td>${money(s.price*s.qty-s.discount)}</td><td>${money(s.cost*s.qty)}</td><td style="color:var(--green);font-weight:750">${money(s.price*s.qty-s.discount-s.cost*s.qty)}</td></tr>`).join('')}</tbody></table></div></div>`}
function settingsPage(){return pageHead('PREFERENCES','Settings','Basic showroom and prototype settings.', '')+`<div class="grid-two"><section class="panel"><div class="panel-head"><div><h2>Showroom profile</h2><p>Business details shown in this prototype</p></div></div><div class="modal-body"><div class="form-grid"><div class="field full"><label>Showroom name</label><input value="Showroom Pro" id="settingName"></div><div class="field"><label>Currency</label><select disabled><option>NPR · Nepalese Rupee</option></select></div><div class="field"><label>Access model</label><input value="Single administrator" disabled></div><div class="field full"><label>Address</label><input placeholder="Enter showroom address"></div></div><p class="form-note">This is a static prototype. Settings and data are not connected to a real backend.</p><button class="btn primary" style="margin-top:16px" data-action="save-settings">Save preferences</button></div></section><section class="panel"><div class="panel-head"><div><h2>Prototype information</h2><p>What this demo includes</p></div></div><div class="activity"><div class="activity-row"><div class="activity-icon">✓</div><div class="activity-text"><strong>Interactive navigation</strong><small>Move between dashboard, inventory, sales and finance.</small></div></div><div class="activity-row"><div class="activity-icon">✓</div><div class="activity-text"><strong>Sample showroom data</strong><small>Seeded products, customers, sales and payment history.</small></div></div><div class="activity-row"><div class="activity-icon">✓</div><div class="activity-text"><strong>In-session actions</strong><small>New records update the prototype until refresh.</small></div></div><div class="activity-row"><div class="activity-icon">!</div><div class="activity-text"><strong>No persistent database</strong><small>Refreshing the page resets the sample data.</small></div></div></div></section></div>`}
function render(){let el=document.getElementById('content');el.innerHTML=({dashboard:dash,stock:()=>inventoryPage(true),inventory:()=>inventoryPage(false),sales:salesPage,installments:installmentsPage,finance:financePage,customers:customersPage,reports:reportsPage,settings:settingsPage})[page]();bindPage()}
function bindPage(){let q=document.getElementById('itemSearch'),cat=document.getElementById('itemCategory'),st=document.getElementById('itemStatus');if(q){let filter=()=>{let list=page==='stock'?items.filter(i=>i.qty<=i.min):items;list=list.filter(i=>(i.name+' '+i.sku+' '+i.category).toLowerCase().includes(q.value.toLowerCase())&&(!cat.value||i.category===cat.value)&&(!st.value|| (i.qty===0?'Out of stock':i.qty<=i.min?'Low stock':'In stock')===st.value));document.getElementById('itemRows').innerHTML=inventoryRows(list);document.getElementById('itemCount').textContent=`Showing ${list.length} products`;bindRows()};q.oninput=filter;cat.onchange=filter;st.onchange=filter}
let sq=document.getElementById('salesSearch'),sm=document.getElementById('salesMode'),ss=document.getElementById('salesStatus');if(sq){let filter=()=>{let list=sales.filter(s=>(s.id+' '+s.customer+' '+s.itemName).toLowerCase().includes(sq.value.toLowerCase())&&(!sm.value||s.mode===sm.value)&&(!ss.value||(outstanding(s)===0?'Paid':'Ongoing')===ss.value));document.getElementById('salesRows').innerHTML=saleRows(list);document.getElementById('salesCount').textContent=`${list.length} transactions`;bindRows()};sq.oninput=filter;sm.onchange=filter;ss.onchange=filter}
let cq=document.getElementById('customerSearch');if(cq)cq.oninput=()=>{document.getElementById('customerRows').innerHTML=customerRows(customers.filter(c=>(c.name+' '+c.phone+' '+c.address).toLowerCase().includes(cq.value.toLowerCase())));bindRows()};
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));bindRows()}
function bindRows(){document.querySelectorAll('[data-edit-item]').forEach(b=>b.onclick=()=>openItem(Number(b.dataset.editItem)));document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>openPayment(b.dataset.pay));document.querySelectorAll('[data-sale]').forEach(b=>b.onclick=()=>showSale(b.dataset.sale));document.querySelectorAll('[data-customer]').forEach(b=>b.onclick=()=>showCustomer(Number(b.dataset.customer)))}
function action(a){if(a==='new-item')openItem();if(a==='new-sale')openSale();if(a==='receive-payment')openPayment();if(a==='new-customer')openCustomer();if(a==='new-expense')openExpense();if(a==='export-csv')exportCSV();if(a==='save-settings'){let n=document.getElementById('settingName').value;showToast('Preferences saved for this session'+(n?' · '+n:''))}}
function field(name,label,type='text',value='',opts=[],required=true,extra=''){let options=opts.length?`<select name="${name}" ${required?'required':''}>${opts.map(o=>`<option value="${esc(o.value??o)}" ${String(o.value??o)===String(value)?'selected':''}>${esc(o.label??o)}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${name}" ${required?'required':''}>${esc(value)}</textarea>`:`<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${extra}>`;return `<div class="field"><label>${label}</label>${options}</div>`}
function openModal(title,sub,body,submitLabel,fn){document.getElementById('modalTitle').textContent=title;document.getElementById('modalSubtitle').textContent=sub;document.getElementById('modalBody').innerHTML=`<div class="form-grid">${body}</div>`;document.getElementById('submitModal').textContent=submitLabel;modalAction=fn;document.getElementById('modalBackdrop').classList.add('open')}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('open');modalAction=null}
document.getElementById('closeModal').onclick=closeModal;document.getElementById('cancelModal').onclick=closeModal;document.getElementById('modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.getElementById('modalForm').onsubmit=e=>{e.preventDefault();if(modalAction)modalAction(new FormData(e.target));closeModal()};
function openItem(id){let it=items.find(i=>i.id===id)||{name:'',sku:'',category:'Television',supplier:'',cost:'',price:'',qty:0,min:2,icon:'📦'},editing=!!id;openModal(editing?'Edit inventory item':'Add inventory item',editing?'Update product details and stock levels.':'Add a product to your showroom catalog.',field('name','Product name','text',it.name)+field('sku','SKU / item code','text',it.sku)+field('category','Category','text',it.category)+field('supplier','Supplier','text',it.supplier)+field('cost','Purchase price (NPR)','number',it.cost,[],true,'min="0"')+field('price','Selling price (NPR)','number',it.price,[],true,'min="0"')+field('qty','Quantity in stock','number',it.qty,[],true,'min="0"')+field('min','Low-stock alert at','number',it.min,[],true,'min="0"'),'Save item',f=>{let d=Object.fromEntries(f);d.cost=+d.cost;d.price=+d.price;d.qty=+d.qty;d.min=+d.min;d.icon=it.icon||'📦';if(editing)items=items.map(x=>x.id===id?{...x,...d}:x);else items.unshift({id:nextItem++,...d});render();showToast(editing?'Inventory item updated':'New item added to inventory')})}
function openSale(){let available=items.filter(i=>i.qty>0);if(!available.length){showToast('Add stock before recording a sale.');return}let custOpts=customers.map(c=>({value:c.name,label:`${c.name} · ${c.phone}`})),itemOpts=available.map(i=>({value:i.id,label:`${i.name} · ${i.qty} in stock`}));openModal('Record a sale','Create a cash sale or installment account. Stock is reduced when the sale is recorded.',field('customer','Customer','text','',[],true,'list="customerSuggestions"')+`<datalist id="customerSuggestions">${customers.map(c=>`<option value="${esc(c.name)}">${esc(c.phone)}</option>`).join('')}</datalist>`+field('phone','Phone number','tel','')+field('itemId','Product','select',available[0].id,itemOpts)+field('qty','Quantity','number',1,[],true,'min="1"')+field('price','Selling price per unit (NPR)','number',available[0].price,[],true,'min="0"')+field('discount','Discount (NPR)','number',0,[],true,'min="0"')+field('mode','Payment type','select','Cash',['Cash','Installment'])+field('paid','Amount received now (NPR)','number',0,[],true,'min="0"')+field('months','Installment term','select','3',['3','4','5','6','9','12'].map(x=>({value:x,label:x+' months'})))+field('date','Sale date','date',today.toISOString().slice(0,10))+`<div class="field full"><label>Note (optional)</label><textarea name="note" placeholder="Serial number, warranty or other notes"></textarea></div>`,'Record sale',f=>{let d=Object.fromEntries(f),it=items.find(i=>i.id===+d.itemId),qty=+d.qty,price=+d.price,discount=+d.discount,paid=+d.paid;if(!it||qty<1||qty>it.qty){showToast('Quantity exceeds available stock.');return}if(discount>price*qty||paid>price*qty-discount){showToast('Check discount and amount received.');return}if(d.mode==='Cash'&&paid<price*qty-discount){showToast('For cash sales, amount received must cover the total.');return}let customer=customers.find(c=>c.name.toLowerCase()===d.customer.trim().toLowerCase());if(!customer){customer={id:nextCustomer++,name:d.customer.trim(),phone:d.phone,address:'Not provided',sales:0};customers.push(customer)}customer.phone=d.phone||customer.phone;customer.sales++;let sale={id:'SL-'+nextSale++,date:d.date,customer:customer.name,phone:d.phone,itemId:it.id,itemName:it.name,qty,price,cost:it.cost,discount,mode:d.mode,paid,months:d.mode==='Installment'?+d.months:0,status:paid>=price*qty-discount?'Paid':'Ongoing'};sales.unshift(sale);it.qty-=qty;if(paid>0)payments.push({saleId:sale.id,date:d.date,customer:customer.name,amount:paid,method:d.mode==='Cash'?'Cash':'Down payment',note:d.note||''});go('sales');showToast(`Sale ${sale.id} recorded successfully`)})}
function openPayment(saleId){let active=sales.filter(s=>outstanding(s)>0),opts=active.map(s=>({value:s.id,label:`${s.id} · ${s.customer} · balance ${money(outstanding(s))}`}));if(!opts.length){showToast('No outstanding installment balances.');return}let s=sales.find(x=>x.id===saleId)||active[0];openModal('Receive installment','Record a payment received from a customer.',field('saleId','Sale / account','select',s.id,opts)+field('amount','Amount received (NPR)','number','',[],true,'min="1"')+field('date','Payment date','date',today.toISOString().slice(0,10))+field('method','Payment method','select','Cash',['Cash','Bank transfer','QR payment','Card'])+`<div class="field full"><label>Receipt note (optional)</label><textarea name="note" placeholder="Receipt number or payment note"></textarea></div>`,'Record payment',f=>{let d=Object.fromEntries(f),sale=sales.find(x=>x.id===d.saleId),amount=+d.amount;if(!sale||amount<=0||amount>outstanding(sale)){showToast('Payment must be greater than zero and no more than the remaining balance.');return}sale.paid+=amount;sale.status=outstanding(sale)===0?'Paid':'Ongoing';payments.push({saleId:sale.id,date:d.date,customer:sale.customer,amount,method:d.method,note:d.note||''});go('installments');showToast('Payment received and balance updated')})}
function openCustomer(){openModal('Add customer','Save customer contact information for future sales.',field('name','Full name')+field('phone','Phone number','tel')+field('address','Location / address','text','',[],false),'Add customer',f=>{let d=Object.fromEntries(f);if(customers.some(c=>c.phone===d.phone)){showToast('A customer with this phone number already exists.');return}customers.push({id:nextCustomer++,...d,sales:0});go('customers');showToast('Customer added successfully')})}
function openExpense(){openModal('Add expense','Record an operating expense for the finance summary.',field('name','Expense name')+field('category','Category','select','Rent',['Rent','Logistics','Utilities','Salary','Marketing','Maintenance','Other'])+field('amount','Amount (NPR)','number','',[],true,'min="1"')+field('date','Date','date',today.toISOString().slice(0,10)),'Add expense',f=>{let d=Object.fromEntries(f);d.amount=+d.amount;if(d.amount<=0){showToast('Enter an expense amount greater than zero.');return}expenses.unshift(d);go('finance');showToast('Expense recorded')})}
function showSale(id){let s=sales.find(x=>x.id===id);if(!s)return;openModal(`Sale ${s.id}`,'Transaction summary',`<div class="field"><label>Customer</label><input value="${esc(s.customer)}" disabled></div><div class="field"><label>Product</label><input value="${esc(s.itemName)}" disabled></div><div class="field"><label>Sale total</label><input value="${money(s.price*s.qty-s.discount)}" disabled></div><div class="field"><label>Amount received</label><input value="${money(s.paid)}" disabled></div><div class="field"><label>Outstanding balance</label><input value="${money(outstanding(s))}" disabled></div><div class="field"><label>Payment type</label><input value="${s.mode}" disabled></div>`,'Close',()=>{});document.getElementById('submitModal').onclick=closeModal;document.getElementById('modalForm').onsubmit=e=>{e.preventDefault();closeModal()}}
function showCustomer(id){let c=customers.find(x=>x.id===id);if(!c)return;let cs=sales.filter(s=>s.customer===c.name);openModal(c.name,'Customer account summary',`<div class="field"><label>Phone</label><input value="${esc(c.phone)}" disabled></div><div class="field"><label>Location</label><input value="${esc(c.address)}" disabled></div><div class="field"><label>Purchases</label><input value="${cs.length}" disabled></div><div class="field"><label>Outstanding</label><input value="${money(cs.reduce((a,s)=>a+outstanding(s),0))}" disabled></div>`,'Close',()=>{});document.getElementById('submitModal').onclick=closeModal;document.getElementById('modalForm').onsubmit=e=>{e.preventDefault();closeModal()}}
function exportCSV(){let rows=[['Sale ID','Date','Customer','Phone','Product','Quantity','Payment type','Total','Paid','Outstanding','Purchase cost','Gross profit'],...sales.map(s=>[s.id,s.date,s.customer,s.phone,s.itemName,s.qty,s.mode,s.price*s.qty-s.discount,s.paid,outstanding(s),s.cost*s.qty,s.price*s.qty-s.discount-s.cost*s.qty])];let csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='showroom-sales-report.csv';a.click();URL.revokeObjectURL(a.href);showToast('Sales report exported as CSV')}
render();
</script>
</body>
